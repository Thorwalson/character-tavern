<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&D Zufallscharakter &amp; Namen</title>
<style>
  :root { --bg:#16110f; --panel:#221a17; --line:#4a3029; --red:#c8402f; --red-2:#8f2a1d; --text:#f1e7dc; --muted:#b09d8e; --bone:#e8d9bb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Georgia,"Times New Roman",serif; color:var(--text);
    background: radial-gradient(700px 400px at 50% -8%, rgba(200,64,47,.28), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 2px, transparent 2px 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 92px), var(--bg); }
  .wrap { max-width:900px; margin:0 auto; padding:1.4rem 1rem 3rem; }
  h1 { margin:.2rem 0; text-align:center; color:var(--bone); letter-spacing:.08em; text-transform:uppercase; text-shadow:0 2px 0 #000, 0 0 22px rgba(200,64,47,.5); }
  .sub { text-align:center; color:var(--muted); margin:0 0 1.2rem; }
  .tabs { display:flex; justify-content:center; gap:.5rem; margin-bottom:1.2rem; }
  .tab { font:inherit; font-weight:700; padding:.55rem 1.2rem; cursor:pointer; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:8px 8px 0 0; }
  .tab.on { color:var(--bone); border-color:var(--red); background:linear-gradient(180deg,#3a211b,var(--panel)); box-shadow:0 2px 0 var(--red); }
  .bar { display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center; align-items:flex-end; margin-bottom:1.2rem; }
  .bar label { display:flex; flex-direction:column; gap:.25rem; font-size:.85rem; color:var(--muted); }
  .chk { flex-direction:row !important; align-items:center; gap:.4rem !important; }
  select, button { font:inherit; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.5rem .7rem; min-width:150px; }
  .go { padding:.65rem 1.7rem; font-weight:700; cursor:pointer; color:#fff; background:linear-gradient(180deg,var(--red),var(--red-2));
    border:2px solid #ffb0a055; border-radius:8px; box-shadow:0 4px 0 #4d150d, 0 8px 18px rgba(0,0,0,.5); letter-spacing:.04em; }
  .go:active { transform:translateY(2px); box-shadow:0 2px 0 #4d150d; }
  .sheet { background:linear-gradient(180deg,#2a201c,#1c1512); border:2px solid var(--red); border-radius:10px; padding:1.2rem; box-shadow:0 0 0 4px #0007, 0 0 30px rgba(200,64,47,.25); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.7rem; margin-bottom:1rem; }
  .field { background:#140f0d; border:1px solid var(--line); border-radius:8px; padding:.6rem .85rem; position:relative; }
  .field small { display:block; color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; }
  .field b { display:block; font-size:1.2rem; margin-top:.1rem; color:var(--bone); }
  .field .re { position:absolute; top:.45rem; right:.5rem; background:none; border:0; color:var(--muted); cursor:pointer; font-size:1rem; }
  .field .re:hover { color:var(--red); transform:rotate(90deg); }
  .abil { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:.6rem; }
  .ab { text-align:center; background:#140f0d; border:1px solid var(--line); border-radius:10px; padding:.5rem .3rem; }
  .ab small { display:block; color:var(--muted); letter-spacing:.1em; font-size:.72rem; }
  .ab .v { font-size:1.7rem; font-weight:700; color:var(--bone); }
  .ab .m { color:var(--red); font-weight:700; }
  .actions { display:flex; gap:.6rem; justify-content:center; margin-top:1rem; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.45rem 1rem; cursor:pointer; }
  .ghost:hover { border-color:var(--red); color:var(--bone); }
  .note { text-align:center; color:var(--muted); font-size:.85rem; margin-top:.8rem; }
  .namegrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.6rem; }
  .name { padding:.6rem .8rem; background:var(--panel); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:1.1rem; transition:border-color .15s, transform .15s; }
  .name:hover { border-color:var(--red); transform:translateY(-1px); }
  .name.copied { border-color:#7c7; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dungeons &amp; Dragons</h1>
  <p class="sub">Zufallscharakter und Namen für deine nächste Kampagne.</p>

  <div class="tabs">
    <button class="tab on" data-tab="char">⚔️ Zufallscharakter</button>
    <button class="tab" data-tab="names">📜 Namen</button>
  </div>

  <section id="char">
    <div class="bar">
      <label>Werte-Methode
        <select id="method"><option value="4d6">4W6, niedrigsten streichen</option><option value="std">Standardwerte (15, 14, 13, 12, 10, 8)</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="smart" checked> Werte passend zur Klasse verteilen</label>
      <button class="go" id="goChar">🎲 Charakter würfeln</button>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="grid">
        <div class="field"><button class="re" data-re="race" title="Neu würfeln">↻</button><small>Volk</small><b id="race"></b></div>
        <div class="field"><button class="re" data-re="cls" title="Neu würfeln">↻</button><small>Klasse</small><b id="cls"></b></div>
        <div class="field"><button class="re" data-re="bg" title="Neu würfeln">↻</button><small>Hintergrund</small><b id="bg"></b></div>
        <div class="field"><button class="re" data-re="al" title="Neu würfeln">↻</button><small>Gesinnung</small><b id="al"></b></div>
        <div class="field"><button class="re" data-re="name" title="Neu würfeln">↻</button><small>Name</small><b id="name"></b></div>
        <div class="field"><button class="re" data-re="trait" title="Neu würfeln">↻</button><small>Charakterzug</small><b id="trait" style="font-size:1rem"></b></div>
      </div>
      <div class="abil" id="abil"></div>
      <div class="actions">
        <button class="ghost" id="copyChar">📋 Kopieren</button>
        <button class="ghost" id="reAbil">Werte neu würfeln</button>
      </div>
    </div>
    <p class="note">Hinweis: Volks-Boni auf Attributswerte sind nicht eingerechnet – die hängen von deiner Regelversion ab.</p>
  </section>

  <section id="namesTab" hidden>
    <div class="bar">
      <label>Volk <select id="nRace"></select></label>
      <label>Geschlecht <select id="nGender"><option value="m">Männlich</option><option value="f">Weiblich</option><option value="x">Egal</option></select></label>
      <button class="go" id="goNames">🎲 Namen würfeln</button>
    </div>
    <div id="namelist"></div>
  </section>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const RACES = ['Aasimar','Drachenblütiger','Elf','Gnom','Goliath','Halbelf','Halbling','Halbork','Mensch','Tiefling','Zwerg'];
const CLASSES = {
  'Barbar':       ['STR','CON','DEX','WIS','CHA','INT'],
  'Barde':        ['CHA','DEX','CON','WIS','INT','STR'],
  'Kleriker':     ['WIS','CON','STR','CHA','DEX','INT'],
  'Druide':       ['WIS','CON','DEX','INT','CHA','STR'],
  'Kämpfer':      ['STR','CON','DEX','WIS','CHA','INT'],
  'Mönch':        ['DEX','WIS','CON','STR','INT','CHA'],
  'Paladin':      ['STR','CHA','CON','WIS','DEX','INT'],
  'Waldläufer':   ['DEX','WIS','CON','STR','INT','CHA'],
  'Schurke':      ['DEX','INT','CHA','CON','WIS','STR'],
  'Zauberer':     ['CHA','CON','DEX','WIS','INT','STR'],
  'Hexenmeister': ['CHA','CON','DEX','WIS','INT','STR'],
  'Magier':       ['INT','CON','DEX','WIS','CHA','STR']
};
const ABIL_DE = { STR:'Stärke', DEX:'Geschick', CON:'Konstitution', INT:'Intelligenz', WIS:'Weisheit', CHA:'Charisma' };
const ORDER = ['STR','DEX','CON','INT','WIS','CHA'];
const BGS = ['Akolyth','Scharlatan','Krimineller','Unterhaltungskünstler','Volksheld','Gildenhandwerker','Eremit','Adliger','Fremder','Weiser','Seemann','Soldat','Gassenkind'];
const ALIGN = ['Rechtschaffen gut','Neutral gut','Chaotisch gut','Rechtschaffen neutral','Neutral','Chaotisch neutral','Rechtschaffen böse','Neutral böse','Chaotisch böse'];
const TRAITS = ['Erzählt bei jeder Gelegenheit eine Geschichte','Misstraut jedem, der zu freundlich ist','Sammelt kleine Andenken','Hat nie genug Proviant dabei','Spricht mit Tieren, als würden sie antworten','Schuldet jemandem einen großen Gefallen','Kann kein Rätsel ungelöst lassen','Hat Angst vor etwas Lächerlichem','Schwört bei einem völlig unbekannten Gott','Gibt jedem Schwert einen Namen'];

/* Namen */
const NAMES = {
  'Mensch':  { f:['Al','Bran','Cor','Dar','Ed','Gar','Hal','Ivo','Lor','Mar','Ser','Wil'], m:['ric','wyn','ard','den','mund','vin'], w:['elle','ina','wyn','lyn','ara','isa'], fam:['Eisen','Rabe','Stein','Hohen','Wolf','Eich','Berg','Nacht'], famS:['hammer','wald','feld','schild','bach','wacht','stein','fels'] },
  'Elf':     { f:['Ael','Ila','Sil','Thal','Ysa','Mal','Fen','Ere','Nae','Cal'], m:['iel','andil','oran','eth','ion','alas'], w:['ria','elle','ana','ysse','ora','isa'], fam:['Mond','Stern','Silber','Blatt','Sonnen','Morgen'], famS:['flüstern','schein','wacht','tau','lied','wind'] },
  'Zwerg':   { f:['Bor','Dur','Gim','Thor','Brom','Kaz','Mor','Tor','Hald','Dag'], m:['rin','grim','dan','mir','dok','bur'], w:['dis','wyn','ra','hild','na','git'], fam:['Eisen','Stein','Gold','Tiefen','Feuer','Amboss'], famS:['faust','bart','schmied','hammer','bruch','herz'] },
  'Halbling':{ f:['Pip','Bil','Mer','Fro','Rosa','Tob','Lil','Sam','Cora','Ned'], m:['bo','by','win','ric','do','lo'], w:['bell','na','ie','ra','lyn','sy'], fam:['Grün','Hügel','Dick','Weich','Schnell','Warm'], famS:['fuß','hügel','busch','topf','korb','tal'] },
  'Gnom':    { f:['Fizz','Zik','Bim','Nib','Gaz','Tink','Wiz','Pip','Zap','Mek'], m:['wick','bolt','spark','gear','nick','zle'], w:['ette','ix','bell','zy','lin','spring'], fam:['Zahn','Funken','Kurbel','Blitz','Rad','Dampf'], famS:['rad','werk','feder','zünder','kolben','knopf'] },
  'Drachenblütiger':{ f:['Bal','Dra','Kri','Ghe','Medr','Nad','Sora','Tar','Rhog','Ari'], m:['asar','ash','ran','gar','jhan','thar'], w:['ra','ia','essa','ira','shi','ala'], fam:['Klar','Feuer','Schuppen','Himmels','Kron','Donner'], famS:['atem','flug','schwinge','gipfel','hort','zahn'] },
  'Tiefling':{ f:['Mal','Zar','Vor','Ame','Kai','Lil','Mor','Nyx','Rie','Ska'], m:['akas','dros','thos','ius','rex','mon'], w:['ira','ith','iel','eth','ria','ane'], fam:['Asche','Nacht','Dorn','Glut','Schatten','Rauch'], famS:['kind','schwur','flamme','pakt','blick','hauch'] },
  'Halbork': { f:['Gro','Mak','Thok','Zug','Dro','Gar','Hurk','Kil','Uth','Rok'], m:['gar','nak','dok','grim','thar','osh'], w:['ka','ga','sha','za','ra','ga'], fam:['Knochen','Blut','Eisen','Zorn','Narben','Brand'], famS:['brecher','zahn','faust','spalter','pranke','hauer'] }
};
let cur = null;

function nameFor(race, g) {
  const N = NAMES[race] || NAMES['Mensch'];
  const gender = g === 'x' || !g ? pick(['m', 'w']) : (g === 'f' ? 'w' : 'm');
  const first = cap((pick(N.f) + pick(N[gender])).replace(/(.)\1\1+/g, '$1$1').toLowerCase());
  return first + ' ' + pick(N.fam) + pick(N.famS);
}
function roll4d6() { const d = [1,2,3,4].map(() => 1 + Math.floor(Math.random() * 6)).sort((a, b) => a - b); return d[1] + d[2] + d[3]; }
function scores(cls) {
  let vals = $('method').value === 'std' ? [15,14,13,12,10,8] : [0,0,0,0,0,0].map(roll4d6);
  vals.sort((a, b) => b - a);
  const out = {};
  if ($('smart').checked) CLASSES[cls].forEach((k, i) => out[k] = vals[i]);
  else { vals.sort(() => Math.random() - .5); ORDER.forEach((k, i) => out[k] = vals[i]); }
  return out;
}
function rollAll() {
  const cls = pick(Object.keys(CLASSES));
  const race = pick(RACES);
  cur = { race, cls, bg: pick(BGS), al: pick(ALIGN), trait: pick(TRAITS), name: nameFor(race, 'x'), ab: scores(cls) };
  show();
}
function reroll(what) {
  if (!cur) return;
  if (what === 'race') { cur.race = pick(RACES); cur.name = nameFor(cur.race, 'x'); }
  else if (what === 'cls') { cur.cls = pick(Object.keys(CLASSES)); cur.ab = scores(cur.cls); }
  else if (what === 'bg') cur.bg = pick(BGS);
  else if (what === 'al') cur.al = pick(ALIGN);
  else if (what === 'trait') cur.trait = pick(TRAITS);
  else if (what === 'name') cur.name = nameFor(cur.race, 'x');
  show();
}
function show() {
  $('sheet').hidden = false;
  ['race','cls','bg','al','trait','name'].forEach((k) => $(k).textContent = cur[k]);
  $('abil').innerHTML = ORDER.map((k) => {
    const v = cur.ab[k], m = Math.floor((v - 10) / 2);
    return `<div class="ab"><small>${ABIL_DE[k]}</small><div class="v">${v}</div><div class="m">${m >= 0 ? '+' : ''}${m}</div></div>`;
  }).join('');
}

/* Tabs */
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  $('char').hidden = t.dataset.tab !== 'char';
  $('namesTab').hidden = t.dataset.tab !== 'names';
}));
document.querySelectorAll('[data-re]').forEach((b) => b.addEventListener('click', () => reroll(b.dataset.re)));
$('goChar').addEventListener('click', rollAll);
$('reAbil').addEventListener('click', () => { if (cur) { cur.ab = scores(cur.cls); show(); } });
$('copyChar').addEventListener('click', () => {
  if (!cur) return;
  const t = `${cur.name} – ${cur.race} ${cur.cls}, ${cur.bg}, ${cur.al}\n` + ORDER.map((k) => `${k} ${cur.ab[k]}`).join(', ');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $('copyChar').textContent = '✔ Kopiert'; setTimeout(() => $('copyChar').textContent = '📋 Kopieren', 1400); }).catch(() => prompt('Zum Kopieren:', t));
});

Object.keys(NAMES).forEach((r) => { const o = document.createElement('option'); o.textContent = r; $('nRace').append(o); });
function renderNames() {
  const box = $('namelist'); box.textContent = '';
  const wrap = document.createElement('div'); wrap.className = 'namegrid';
  const seen = new Set();
  while (seen.size < 12) seen.add(nameFor($('nRace').value, $('nGender').value));
  seen.forEach((n) => {
    const d = document.createElement('div'); d.className = 'name'; d.textContent = n;
    d.addEventListener('click', () => { (navigator.clipboard ? navigator.clipboard.writeText(n) : Promise.reject()).then(() => { d.classList.add('copied'); setTimeout(() => d.classList.remove('copied'), 700); }).catch(() => prompt('Zum Kopieren:', n)); });
    wrap.append(d);
  });
  box.append(wrap);
}
$('goNames').addEventListener('click', renderNames);
$('nRace').addEventListener('change', renderNames);
$('nGender').addEventListener('change', renderNames);
renderNames();
</script>
</body>
</html>
